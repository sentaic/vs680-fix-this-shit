[package]
name = "vs680-hid"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-only"
description = "FunctionFS HID report relay for VS680 development"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
libc = "=0.2.189"
minicbor = { version = "=2.3.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
